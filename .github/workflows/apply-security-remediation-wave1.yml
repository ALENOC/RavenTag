name: Inspect backend dependency advisories

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'ALENOC/RavenTag' && github.head_ref == 'security/full-audit-remediation-2026-08-18'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${HEAD_REPO}.git"
          git fetch --depth=1 origin "${HEAD_REF}"
          git checkout --detach FETCH_HEAD
      - name: Install exact backend lockfile
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Print exact npm audit JSON
        working-directory: backend
        run: |
          set +e
          npm audit --json > /tmp/npm-audit.json
          rc=$?
          node - <<'NODE'
          const a=require('/tmp/npm-audit.json');
          console.log('AUDIT_METADATA', JSON.stringify(a.metadata||{}));
          for (const [name,v] of Object.entries(a.vulnerabilities||{})) {
            console.log('ADVISORY', JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,via:v.via,effects:v.effects,range:v.range,nodes:v.nodes,fixAvailable:v.fixAvailable}));
          }
          NODE
          exit $rc
