name: Resolve compatible backend dependency versions

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  versions:
    if: github.repository == 'ALENOC/RavenTag' && github.head_ref == 'security/full-audit-remediation-2026-08-18'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${HEAD_REPO}.git"
          git fetch --depth=1 origin "${HEAD_REF}"
          git checkout --detach FETCH_HEAD
      - name: Resolve latest versions within current major lines
        working-directory: backend
        run: |
          set -euo pipefail
          for spec in 'axios@1' 'express@4' 'express-rate-limit@8' 'form-data@4' 'multer@2' 'tsx@4'; do
            printf '%s = ' "$spec"
            npm view "$spec" version --json | tail -n 3
          done
          npm ci --ignore-scripts >/dev/null
          set +e
          npm audit fix --dry-run --json > /tmp/dry.json
          rc=$?
          node - <<'NODE'
          const a=require('/tmp/dry.json');
          console.log('DRYRUN', JSON.stringify(a, null, 2).slice(0,30000));
          NODE
          exit 0
