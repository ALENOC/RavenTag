name: Diagnose security remediation wave 2

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'ALENOC/RavenTag' && github.head_ref == 'security/full-audit-remediation-2026-08-18'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${HEAD_REPO}.git"
          git fetch --depth=1 origin "${HEAD_REF}"
          git checkout --detach FETCH_HEAD
      - name: Transform and print residual broadcast
        run: |
          python3 scripts/run_security_remediation_wave2_diag.py
          grep -n -C 12 'node.broadcastWithAllServers(tx.hex)' android/app/src/main/java/io/raventag/app/wallet/WalletManager.kt || true
