name: Diagnose security remediation wave 2 Kotlin integration

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'ALENOC/RavenTag' && github.head_ref == 'security/full-audit-remediation-2026-08-18'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${HEAD_REPO}.git"
          git fetch --depth=1 origin "${HEAD_REF}"
          git checkout --detach FETCH_HEAD
      - name: Transform and print integration contexts
        run: |
          set -euo pipefail
          python3 scripts/run_security_remediation_wave2_v5.py
          echo '--- onSend ---'
          grep -n -C 5 'onSend = viewModel::sendRvn' android/app/src/main/java/io/raventag/app/MainActivity.kt || true
          echo '--- xferNow ---'
          grep -n -C 14 'xferNow' android/app/src/main/java/io/raventag/app/wallet/WalletManager.kt || true
          echo '--- around compiler 2960 ---'
          nl -ba android/app/src/main/java/io/raventag/app/wallet/WalletManager.kt | sed -n '2935,2985p'
          echo '--- nullable privKey sites ---'
          grep -n -C 4 'privKeyBytes = privKey,' android/app/src/main/java/io/raventag/app/wallet/WalletManager.kt || true
