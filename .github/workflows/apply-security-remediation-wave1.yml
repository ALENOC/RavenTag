name: Diagnose security remediation wave 2 Android failures

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'ALENOC/RavenTag' && github.head_ref == 'security/full-audit-remediation-2026-08-18'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout remediation branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${HEAD_REPO}.git"
          git fetch --depth=1 origin "${HEAD_REF}"
          git checkout --detach FETCH_HEAD
      - name: Apply exact wave2 transform
        run: |
          python3 scripts/run_security_remediation_wave2_v6.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/src/index.ts'); s=p.read_text(); old='  startBackupScheduler()\n'; new='''  if (process.env.ENABLE_INTERNAL_BACKUP === 'true') {\n    const backupKeyPath = process.env.INTERNAL_BACKUP_ENCRYPTION_KEY_FILE\n    if (!backupKeyPath) throw new Error('ENABLE_INTERNAL_BACKUP requires INTERNAL_BACKUP_ENCRYPTION_KEY_FILE')\n    startBackupScheduler(backupKeyPath)\n  }\n''';
          if s.count(old)!=1: raise SystemExit('backup scheduler anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Run Android tests with concise diagnostics
        working-directory: android
        run: |
          set +e
          chmod +x gradlew
          ./gradlew test --console=plain > /tmp/android-test.log 2>&1
          rc=$?
          echo "GRADLE_EXIT=$rc"
          grep -E -n "(^e: |FAILED|FAILURE:|There were failing tests|Compilation error|> Task .* FAILED|Tests run:|tests completed|AssertionError|expected:|but was:)" /tmp/android-test.log | tail -n 250 || true
          echo '--- final 120 lines ---'
          tail -n 120 /tmp/android-test.log
          exit $rc
