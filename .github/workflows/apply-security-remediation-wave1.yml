name: Apply security remediation wave 1

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'ALENOC/RavenTag' && github.head_ref == 'security/full-audit-remediation-2026-08-18'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact remediation branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${HEAD_REPO}.git"
          git fetch --depth=1 origin "${HEAD_REF}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD

      - name: Apply asserted source patches
        env:
          # Resolved from ghcr.io/github/github-mcp-server:v0.18.0 by the previous
          # successful GitHub runner lookup; immutable digest, not a mutable tag.
          MCP_DIGEST: sha256:6aa543f565bc98d96106fdd80a0abdc0c7147c8ca7f4663a814ceecef1ccc6d3
        run: python3 scripts/run_security_remediation_wave1.py

      - name: Upgrade Axios using npm resolver and type-check backend
        working-directory: backend
        run: |
          set -euo pipefail
          npm install --save-exact --ignore-scripts axios@1.18.0
          npm ci --ignore-scripts
          npm run build

      - name: Compile Android Kotlin after patch
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew compileBrandDebugKotlin compileConsumerDebugKotlin --stacktrace

      - name: Static patch checks
        run: |
          set -euo pipefail
          git diff --check
          ! grep -R '/home/ale/Android/Sdk' --exclude-dir=.git .
          ! grep -R 'QwenLM/qwen-code-action@v1' .github/workflows
          ! grep -R 'ghcr.io/github/github-mcp-server:v0.18.0' .github/workflows
          ! grep -R 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          ! grep -R 'cleartextTrafficPermitted="true"' android/app/src/main/res/xml/network_security_config.xml

      - name: Commit compiled wave and remove one-shot patcher
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f scripts/apply_security_remediation_wave1.py scripts/run_security_remediation_wave1.py .github/workflows/apply-security-remediation-wave1.yml
          git config user.name 'RavenTag Security Remediation'
          git config user.email '185200505+ALENOC@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'security: fail closed auth, network, secrets and fee inputs'
          git push origin HEAD:"${HEAD_REF}"
