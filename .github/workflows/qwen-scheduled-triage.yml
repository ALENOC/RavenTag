name: '📋 Qwen Code Scheduled Issue Triage'

on:
  schedule:
    - cron: '0 * * * *'
  pull_request:
    branches: ['master', 'release/**/*']
    paths: ['.github/workflows/qwen-scheduled-triage.yml']
  push:
    branches: ['master', 'release/**/*']
    paths: ['.github/workflows/qwen-scheduled-triage.yml']
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  triage:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    permissions:
      contents: 'read'
      issues: 'read'
      pull-requests: 'read'
    outputs:
      available_labels: '${{ steps.get_labels.outputs.available_labels }}'
      triaged_issues: '${{ env.TRIAGED_ISSUES }}'
    steps:
      - name: 'Get repository labels'
        id: 'get_labels'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea'
        with:
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            })) labels.push(...response.data);
            if (!labels || labels.length === 0) core.setFailed('There are no issue labels in this repository.');
            const labelNames = labels.map(label => label.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            return labelNames;

      - name: 'Find untriaged issues'
        id: 'find_issues'
        env:
          GITHUB_REPOSITORY: '${{ github.repository }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: |-
          ISSUES="$(gh issue list --state 'open' --search 'no:label label:"status/needs-triage"' --json number,title,body --limit '100' --repo "${GITHUB_REPOSITORY}")"
          echo "issues_to_triage=${ISSUES}" >> "${GITHUB_OUTPUT}"

      - name: 'Run Qwen Code Issue Analysis'
        id: 'qwen_issue_analysis'
        if: ${{ steps.find_issues.outputs.issues_to_triage != '[]' }}
        uses: 'QwenLM/qwen-code-action@05f81718976f3b7da657422e6e8e4d372b8621d7'
        env:
          GITHUB_TOKEN: ''
          ISSUES_TO_TRIAGE: '${{ steps.find_issues.outputs.issues_to_triage }}'
          REPOSITORY: '${{ github.repository }}'
          AVAILABLE_LABELS: '${{ steps.get_labels.outputs.available_labels }}'
        with:
          openai_api_key: '${{ secrets.QWEN_API_KEY }}'
          openai_base_url: '${{ vars.QWEN_BASE_URL }}'
          openai_model: '${{ vars.QWEN_MODEL }}'
          qwen_cli_version: '${{ vars.QWEN_CLI_VERSION }}'
          qwen_debug: '${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'qwen-scheduled-triage'
          settings: |-
            {
              "model": { "maxSessionTurns": 25 },
              "telemetry": { "enabled": true, "target": "local", "outfile": ".qwen/telemetry.log" },
              "tools": { "core": ["run_shell_command(echo)", "run_shell_command(jq)"] }
            }
          prompt: '/qwen-scheduled-triage'

  label:
    runs-on: 'ubuntu-latest'
    needs: ['triage']
    if: needs.triage.outputs.available_labels != '' && needs.triage.outputs.available_labels != '[]' && needs.triage.outputs.triaged_issues != '' && needs.triage.outputs.triaged_issues != '[]'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Apply labels'
        env:
          AVAILABLE_LABELS: '${{ needs.triage.outputs.available_labels }}'
          TRIAGED_ISSUES: '${{ needs.triage.outputs.triaged_issues }}'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || github.token }}'
          script: |-
            const availableLabels = (process.env.AVAILABLE_LABELS || '').split(',').map((label) => label.trim()).sort();
            const triagedIssues = JSON.parse(process.env.TRIAGED_ISSUES || '[]').sort((a, b) => a.issue_number - b.issue_number);
            for (const issue of triagedIssues) {
              if (!issue?.issue_number) continue;
              const labelsToSet = (issue.labels_to_set || []).map((label) => label.trim()).filter((label) => availableLabels.includes(label)).sort();
              if (labelsToSet.length === 0) continue;
              await github.rest.issues.setLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.issue_number, labels: labelsToSet });
            }
